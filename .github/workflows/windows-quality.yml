name: Windows quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release verification
        run: pnpm release:verify
        env:
          # GitHub-hosted Windows runners have variable cold-start performance.
          AILOVER_SMOKE_STARTUP_BUDGET_MS: 30000

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AiLover-Windows-installer
          path: release/AiLover-*-setup.exe
          if-no-files-found: error
          retention-days: 14
